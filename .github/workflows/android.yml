name: Android

# Builds the Android app (android/) into a signed APK. Runs on every push that
# touches it, and from the release workflow, which attaches the APK to the
# GitHub release. The signing key comes from the TOBY_KEYSTORE_B64 and
# TOBY_KEYSTORE_PASSWORD secrets; without them (a fork) the APK is signed with
# a throwaway debug key instead.
on:
  push:
    paths: [android/**, VERSION, .github/workflows/android.yml]
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build
        env:
          TOBY_KEYSTORE_B64: ${{ secrets.TOBY_KEYSTORE_B64 }}
          TOBY_KEYSTORE_PASSWORD: ${{ secrets.TOBY_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$TOBY_KEYSTORE_B64" ]; then
            echo "$TOBY_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/toby.p12"
            export TOBY_KEYSTORE="$RUNNER_TEMP/toby.p12"
          else
            echo "No signing key: using the debug key."
          fi
          cd android
          gradle --no-daemon assembleRelease
          version="$(tr -d '[:space:]' < ../VERSION)"
          cp app/build/outputs/apk/release/app-release.apk "../LittleToby-$version.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "../LittleToby-$version.apk" | head -3 || true
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: LittleToby-*.apk
          if-no-files-found: error
